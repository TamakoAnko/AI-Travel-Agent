services:
  backend:
    build: .
    container_name: travel-agent-backend
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/app.db
      CHECKPOINT_PATH: /app/data/checkpoints.db
      KNOWLEDGE_DIR: /app/data/knowledge
      HOST: 0.0.0.0
      PORT: "8000"
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BAIDU_MAP_AK: ${VITE_BAIDU_MAP_AK:-}
    container_name: travel-agent-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
